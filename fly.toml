app = "bt38-prod"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Only committed events drive governed work; no scheduled hydration.
  # Match the Gunicorn worker environment to avoid conflicting configuration.
  ENABLE_GOVERNED_8H_HYDRATION = "false"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[http_service.concurrency]
  type = "requests"
  hard_limit = 250
  soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
