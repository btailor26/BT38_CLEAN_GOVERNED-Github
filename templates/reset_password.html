<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose new password — BT38 Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center px-6 py-12">
  <main class="w-full max-w-md">
    <a href="/" class="inline-flex items-center" aria-label="BT38 Inventory home">
      <img src="{{ url_for('static', filename='img/marketplaces/bt38-inventory-amazon-developer.svg') }}" alt="BT38 Inventory" class="h-12 w-auto rounded-lg bg-white" height="48">
    </a>

    <form method="POST" action="{{ url_for('bt38_public_password_reset') }}" class="mt-8 rounded-3xl bg-white p-7 text-slate-950 shadow-xl">
      <input type="hidden" name="reset_csrf" value="{{ reset_csrf }}">

      <p class="text-sm font-bold uppercase tracking-wider text-slate-500">Google verified</p>
      <h1 class="mt-2 text-3xl font-black">Choose a new BT38 password</h1>
      <p class="mt-3 text-sm leading-relaxed text-slate-600">This changes only your BT38 password. It does not change your Google password.</p>

      {% if error %}
      <div class="mt-5 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{{ error }}</div>
      {% endif %}

      <label for="username" class="mt-6 block text-sm font-semibold">BT38 email</label>
      <input id="username" name="username" type="email" value="{{ user_email }}" autocomplete="username" readonly class="mt-2 w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-slate-600">

      <label for="new_password" class="mt-5 block text-sm font-semibold">New password</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="At least 8 characters">

      <label for="confirm_password" class="mt-5 block text-sm font-semibold">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="Enter it again">

      <button type="submit" class="mt-6 w-full rounded-xl bg-black px-5 py-3 font-semibold text-white">Reset password</button>
      <p class="mt-4 text-center text-xs text-slate-500">For security, the Google verification expires after 10 minutes.</p>
    </form>
  </main>
</body>
</html>
