name: Governed Fly Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Type DEPLOY_GITHUB_COMMIT_TO_BT38_PROD'
        required: true
      expected_commit:
        description: 'Exact current PR #528 head SHA'
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bt38-prod-governed-deploy
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  source-deploy-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact current PR 528 GitHub source approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_production_deploy }}" = "DEPLOY_GITHUB_COMMIT_TO_BT38_PROD"
          test "${{ github.ref_name }}" = "fix/full-system-release-alignment"
          test "${{ inputs.expected_commit }}" = "${{ github.sha }}"
          PR_JSON="$(gh api repos/${{ github.repository }}/pulls/528)"
          PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          PR_MERGED="$(printf '%s' "$PR_JSON" | jq -r '.merged')"
          PR_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.head.sha')"
          PR_BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.head.ref')"
          test "$PR_STATE" = "open"
          test "$PR_MERGED" = "false"
          test "$PR_BRANCH" = "fix/full-system-release-alignment"
          test "$PR_HEAD" = "${{ inputs.expected_commit }}"
          echo "GOVERNED_SOURCE_APPROVED commit=$PR_HEAD"

  audit:
    needs: source-deploy-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact-head full-source candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "RUN find /app -mindepth 1 -maxdepth 1 ! -name '.venv' -exec rm -rf {} +" Dockerfile.current-image-alignment
          grep -Fq 'COPY . /app' Dockerfile.current-image-alignment
          for PATH_PREFIX in services templates static migrations scripts; do
            if grep -Eq "^${PATH_PREFIX}/$" .dockerignore; then
              echo "BLOCKED: runtime category excluded from exact-head candidate: ${PATH_PREFIX}/"
              exit 1
            fi
          done
          git fetch --no-tags origin main
          RUNTIME_COUNT=0
          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue
            case "$FILE" in
              .github/*|tests/*|docs/*|*.md|.gitignore)
                continue
                ;;
            esac
            if [ ! -e "$FILE" ]; then
              echo "BLOCKED: changed runtime/config path is absent from exact head: $FILE"
              exit 1
            fi
            RUNTIME_COUNT=$((RUNTIME_COUNT + 1))
          done < <(git diff --diff-filter=ACMRTUXB --name-only origin/main...HEAD)
          test "$RUNTIME_COUNT" -gt 0
          echo "EXACT_HEAD_FULL_SOURCE_CANDIDATE_BOUNDARY_OK runtime_changed_files=$RUNTIME_COUNT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --no-dev

      - name: Verify exact candidate image inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f Dockerfile.current-image-alignment
          test -f fly.toml
          test -f pyproject.toml
          test -f uv.lock
          grep -q 'uv sync --frozen --no-dev' Dockerfile
          grep -q 'main:app' Dockerfile
          grep -q 'app = "bt38-prod"' fly.toml
          grep -q 'dockerfile = "Dockerfile.current-image-alignment"' fly.toml
          grep -Fq 'FROM registry.fly.io/bt38-prod:deployment-01M2BK6REHCGKJQ34796T3WK8P@sha256:3f7ca913f010fea40a0b8fe20354cae7c010f802328fa0e1eb41258f32168a8b' Dockerfile.current-image-alignment
          grep -Fq 'COPY . /app' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/cofi_settings_alignment.py /app/services/cofi_settings_alignment.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/revolut_billing.py /app/services/revolut_billing.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/revolut_subscription_alignment.py /app/services/revolut_subscription_alignment.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/support_case_alignment.py /app/services/support_case_alignment.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/support_attachment_alignment.py /app/services/support_attachment_alignment.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/support_monitoring_alignment.py /app/services/support_monitoring_alignment.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/support_notification_alignment.py /app/services/support_notification_alignment.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260911-customer-account-profile.sql /app/migrations/manual/20260911-customer-account-profile.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260911-package-catalog.sql /app/migrations/manual/20260911-package-catalog.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260911-revolut-subscription-binding.sql /app/migrations/manual/20260911-revolut-subscription-binding.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260911-billing-invoices.sql /app/migrations/manual/20260911-billing-invoices.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260911-support-cases.sql /app/migrations/manual/20260911-support-cases.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260912-package-pricing-discount.sql /app/migrations/manual/20260912-package-pricing-discount.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260913-support-case-attachments.sql /app/migrations/manual/20260913-support-case-attachments.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY scripts/verify_production_db_contract.py /app/scripts/verify_production_db_contract.py' Dockerfile.current-image-alignment
          ! grep -Eq 'apt-get |pip install|uv sync|npm (install|ci)' Dockerfile.current-image-alignment
          ! grep -q '^[[:space:]]*image[[:space:]]*=' fly.toml
          echo "EXACT_CANDIDATE_IMAGE_ALIGNMENT_READY"

      - name: Reject corrupt production source files
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.py', '.html', '.js', '.toml', '.md', '.ts', '.json', '.sql'}:
                  continue
              if b'\0' in path.read_bytes():
                  bad.append(str(path))
          if bad:
              raise SystemExit('Null bytes found in production source: ' + ', '.join(bad))
          print('SOURCE_INTEGRITY_OK')
          PY

      - name: Compile complete tracked Python source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' PY_FILES < <(git ls-files -z '*.py')
          test "${#PY_FILES[@]}" -gt 0
          uv run python -m py_compile "${PY_FILES[@]}"
          echo "FULL_TRACKED_PYTHON_COMPILE_OK files=${#PY_FILES[@]}"

      - name: Run complete Python contract suite
        run: |
          uv run python -m pytest -q tests test_concurrent_sales.py

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact audited GitHub commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build exact candidate image without deploying
        id: candidate_image
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "fix/full-system-release-alignment"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
          LABEL="candidate-${{ inputs.expected_commit }}"
          IMAGE="registry.fly.io/bt38-prod:${LABEL}"
          flyctl deploy \
            --app bt38-prod \
            --config fly.toml \
            --remote-only \
            --build-only \
            --push \
            --image-label "$LABEL"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_IMAGE_BUILT=$IMAGE"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify candidate image DB contract against production Neon
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_IMAGE="${{ steps.candidate_image.outputs.image }}"
          test -n "$CANDIDATE_IMAGE"
          MACHINE_NAME="candidate-db-${{ inputs.expected_commit }}"
          MACHINE_NAME="${MACHINE_NAME:0:48}"
          MACHINE_ID=""

          cleanup_candidate_machine() {
            if [ -n "$MACHINE_ID" ]; then
              flyctl machine destroy "$MACHINE_ID" --app bt38-prod --force >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_candidate_machine EXIT

          CREATED=0
          for ATTEMPT in 1 2 3 4 5; do
            set +e
            CREATE_OUTPUT="$(flyctl machine run \
              "$CANDIDATE_IMAGE" \
              sleep infinity \
              --app bt38-prod \
              --region lhr \
              --name "$MACHINE_NAME" \
              --detach \
              --restart no \
              --file-local /tmp/bt38-db-contract.py=scripts/verify_production_db_contract.py \
              2>&1)"
            CREATE_STATUS=$?
            set -e
            printf '%s\n' "$CREATE_OUTPUT"

            if [ "$CREATE_STATUS" -eq 0 ]; then
              MACHINE_ID="$(flyctl machine list --app bt38-prod --json | python -c 'import json,sys; name=sys.argv[1]; rows=json.load(sys.stdin); matches=[str(r.get("id") or "") for r in rows if r.get("name")==name]; print(matches[0] if len(matches)==1 else "")' "$MACHINE_NAME")"
              if [ -z "$MACHINE_ID" ]; then
                echo "BLOCKED: exact candidate verifier Machine started but its unique Machine ID could not be resolved."
                exit 1
              fi
              CREATED=1
              break
            fi

            if printf '%s\n' "$CREATE_OUTPUT" | grep -q 'MANIFEST_UNKNOWN\|manifest unknown'; then
              if [ "$ATTEMPT" -lt 5 ]; then
                echo "WAIT: Fly registry has not propagated the exact candidate manifest yet (attempt $ATTEMPT/5)."
                sleep 15
                continue
              fi
              echo "BLOCKED: exact candidate manifest remained unavailable in Fly registry after bounded propagation retries; DB contract was not executed."
              exit 1
            fi

            echo "BLOCKED: candidate verifier Machine could not be created for a reason other than the proven Fly registry propagation race."
            exit 1
          done

          if [ "$CREATED" -ne 1 ]; then
            echo "BLOCKED: exact candidate verifier Machine was not created; no deployment performed."
            exit 1
          fi

          set +e
          DB_CHECK_OUTPUT="$(flyctl machine exec "$MACHINE_ID" "sh -lc 'cd /app && .venv/bin/python /tmp/bt38-db-contract.py'" --app bt38-prod --timeout 120 2>&1)"
          DB_STATUS=$?
          set -e
          printf '%s\n' "$DB_CHECK_OUTPUT"

          if printf '%s\n' "$DB_CHECK_OUTPUT" | grep -q '^DB_CONTRACT_BLOCKED'; then
            echo "BLOCKED: production Neon does not satisfy the exact candidate DB contract."
            exit 1
          fi

          if [ "$DB_STATUS" -ne 0 ] || ! printf '%s\n' "$DB_CHECK_OUTPUT" | grep -q '^DB_CONTRACT_OK:'; then
            echo "BLOCKED: exact candidate Machine executed the DB proof but did not return DB_CONTRACT_OK."
            exit 1
          fi

          echo "PREDEPLOY_CANDIDATE_DB_CONTRACT_OK image=$CANDIDATE_IMAGE machine=$MACHINE_ID"
          cleanup_candidate_machine
          MACHINE_ID=""
          trap - EXIT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy exact audited candidate image
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "fix/full-system-release-alignment"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
          CANDIDATE_IMAGE="${{ steps.candidate_image.outputs.image }}"
          test -n "$CANDIDATE_IMAGE"
          flyctl deploy \
            --app bt38-prod \
            --config fly.toml \
            --image "$CANDIDATE_IMAGE" \
            --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify all changed deployed runtime source in one Fly SSH session
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MANIFEST="$(mktemp)"
          ABSENT="$(mktemp)"

          include_runtime_path() {
            case "$1" in
              .github/*|tests/*|docs/*|*.md|.gitignore)
                return 1
                ;;
              *)
                return 0
                ;;
            esac
          }

          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue
            include_runtime_path "$FILE" || continue
            test -f "$FILE" || { echo "BLOCKED: audited exact-head runtime file is missing: $FILE"; exit 1; }
            HASH="$(sha256sum "$FILE" | awk '{print $1}')"
            printf '%s  /app/%s\n' "$HASH" "$FILE" >> "$MANIFEST"
          done < <(git diff --diff-filter=ACMRTUXB --name-only origin/main...HEAD)

          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue
            include_runtime_path "$FILE" || continue
            printf '/app/%s\n' "$FILE" >> "$ABSENT"
          done < <(git diff --diff-filter=D --name-only origin/main...HEAD)

          test -s "$MANIFEST"
          MANIFEST_B64="$(base64 -w0 "$MANIFEST")"
          ABSENT_B64="$(base64 -w0 "$ABSENT")"

          VERIFIED=0
          for ATTEMPT in 1 2 3 4 5; do
            set +e
            OUTPUT="$(flyctl ssh console --app bt38-prod --command "sh -lc 'set -eu; printf %s \"$MANIFEST_B64\" | base64 -d > /tmp/bt38-source.sha256; printf %s \"$ABSENT_B64\" | base64 -d > /tmp/bt38-source-absent.txt; sha256sum -c /tmp/bt38-source.sha256; while IFS= read -r FILE; do [ -z \"$FILE\" ] || [ ! -e \"$FILE\" ] || { echo STALE_REMOTE_SOURCE_PRESENT:$FILE; exit 43; }; done < /tmp/bt38-source-absent.txt; echo COMPLETE_CHANGED_RUNTIME_SOURCE_OK'" 2>&1)"
            STATUS=$?
            set -e
            printf '%s\n' "$OUTPUT"

            if [ "$STATUS" -eq 0 ] && printf '%s\n' "$OUTPUT" | grep -q 'COMPLETE_CHANGED_RUNTIME_SOURCE_OK'; then
              VERIFIED=1
              break
            fi

            if printf '%s\n' "$OUTPUT" | grep -q 'FAILED\|STALE_REMOTE_SOURCE_PRESENT'; then
              echo "BLOCKED: deployed runtime source differs from the audited GitHub exact head."
              exit 1
            fi

            echo "WAIT: deployed-source verification unavailable through Fly SSH (attempt $ATTEMPT/5)."
            sleep $((ATTEMPT * 3))
          done

          if [ "$VERIFIED" -ne 1 ]; then
            echo "BLOCKED: complete changed-runtime verification remained unavailable after 5 whole-session attempts."
            exit 1
          fi
          echo "COMPLETE_CHANGED_RUNTIME_DEPLOYED_SOURCE_OK commit=${{ inputs.expected_commit }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify aligned feature registration
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app bt38-prod --command "sh -lc 'cd /app && .venv/bin/python -c \"from app import app; import services; rules={r.rule for r in app.url_map.iter_rules()}; required={\\\"/governed/settings/cofi\\\",\\\"/billing/revolut/start\\\",\\\"/webhooks/revolut\\\",\\\"/admin/revolut/webhook/provision\\\",\\\"/support/cases\\\",\\\"/support/cases/<case_id>\\\",\\\"/support/cases/<case_id>/attachments\\\"}; missing=sorted(required-rules); assert not missing, f\\\"missing routes: {missing}\\\"; print(\\\"ALIGNED_FEATURE_REGISTRATION_OK cofi=True revolut=True support=True\\\")\"'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify effective Google auth and browser session policy
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app bt38-prod --command "sh -lc 'cd /app && .venv/bin/python -c \"import os; from app import app; import services.public_early_access; cid=str(os.getenv(\\\"GOOGLE_CLIENT_ID\\\") or \\\"\\\").strip(); lifetime=app.config.get(\\\"PERMANENT_SESSION_LIFETIME\\\"); lifetime_seconds=int(lifetime.total_seconds()) if hasattr(lifetime,\\\"total_seconds\\\") else int(lifetime); assert app.config.get(\\\"SESSION_COOKIE_SECURE\\\") is True; assert app.config.get(\\\"SESSION_COOKIE_HTTPONLY\\\") is True; assert app.config.get(\\\"SESSION_COOKIE_SAMESITE\\\") == \\\"Lax\\\"; assert app.config.get(\\\"SESSION_REFRESH_EACH_REQUEST\\\") is True; assert app.config.get(\\\"SESSION_PERMANENT\\\") is True; assert lifetime_seconds == 1800; assert app.config.get(\\\"SESSION_COOKIE_DOMAIN\\\") is None; assert app.config.get(\\\"REMEMBER_COOKIE_SECURE\\\") is True; assert app.config.get(\\\"REMEMBER_COOKIE_HTTPONLY\\\") is True; assert app.config.get(\\\"REMEMBER_COOKIE_SAMESITE\\\") == \\\"Lax\\\"; assert cid.endswith(\\\".apps.googleusercontent.com\\\"); print(\\\"AUTH_SESSION_POLICY_OK samesite=Lax secure=True httponly=True sliding_seconds=1800 host_only=True google_client_configured=True\\\")\"'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployed image DB contract against production Neon
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app bt38-prod --command "sh -lc 'cd /app && .venv/bin/python scripts/verify_production_db_contract.py'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Restore Packlink callback secret setting
        shell: bash
        run: |
          set -euo pipefail
          CALLBACK_SECRET="$(flyctl ssh console --app bt38-prod --command "sh -lc 'cd /app && .venv/bin/python -c \"import hashlib,os; key=str(os.environ.get(\\\"PACKLINK_API_KEY\\\") or \\\"\\\").strip(); assert key, \\\"PACKLINK_API_KEY missing\\\"; print(hashlib.sha256((\\\"bt38-packlink-callback:\\\"+key).encode()).hexdigest())\"'" | tail -n 1)"
          test -n "$CALLBACK_SECRET"
          flyctl secrets set --app bt38-prod PACKLINK_CALLBACK_SECRET="$CALLBACK_SECRET"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Restore Packlink callback registration
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app bt38-prod --command "sh -lc \"cd /app && .venv/bin/python -c 'from app import app; from services.fbm_packlink_adapter import PacklinkAdapter; from governed_packlink_callback_routes import _register_callback; ctx=app.test_request_context(base_url=\\\"https://bt38-prod.fly.dev\\\"); ctx.push(); callback_url=_register_callback(PacklinkAdapter()); print(\\\"PACKLINK_CALLBACK_REGISTERED=ok\\\")'\""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set up Node for post-deploy browser proof
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser proof dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify deployed application with Playwright
        run: npx playwright test
