name: Governed Fly Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Type DEPLOY_GITHUB_COMMIT_TO_BT38_PROD'
        required: true
      expected_commit:
        description: 'Exact current PR #528 head SHA'
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bt38-prod-governed-deploy
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  source-deploy-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact current PR 528 GitHub source approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_production_deploy }}" = "DEPLOY_GITHUB_COMMIT_TO_BT38_PROD"
          test "${{ github.ref_name }}" = "fix/full-system-release-alignment"
          test "${{ inputs.expected_commit }}" = "${{ github.sha }}"
          PR_JSON="$(gh api repos/${{ github.repository }}/pulls/528)"
          test "$(printf '%s' "$PR_JSON" | jq -r '.state')" = "open"
          test "$(printf '%s' "$PR_JSON" | jq -r '.merged')" = "false"
          test "$(printf '%s' "$PR_JSON" | jq -r '.head.ref')" = "fix/full-system-release-alignment"
          PR_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.head.sha')"
          test "$PR_HEAD" = "${{ inputs.expected_commit }}"
          echo "GOVERNED_SOURCE_APPROVED commit=$PR_HEAD"

  audit:
    needs: source-deploy-guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bt38_ci
          POSTGRES_PASSWORD: bt38_ci
          POSTGRES_DB: bt38_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bt38_ci -d bt38_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DEV_DATABASE_URL: postgresql://bt38_ci:bt38_ci@127.0.0.1:5432/bt38_ci
      BT38_ALLOW_DATABASE_TESTS: "true"
    steps:
      - name: Checkout exact governed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --no-dev
      - name: Verify governed production inputs
        run: |
          test -f Dockerfile && test -f fly.toml && test -f pyproject.toml && test -f uv.lock
          grep -q 'uv sync --frozen --no-dev' Dockerfile
          grep -q 'main:app' Dockerfile
          grep -q 'app = "bt38-prod"' fly.toml
      - name: Reject corrupt production source files
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          for path in Path('.').rglob('*'):
              if path.is_file() and '.git' not in path.parts and path.suffix.lower() in {'.py','.html','.js','.toml','.md'} and b'\0' in path.read_bytes(): bad.append(str(path))
          if bad: raise SystemExit('Null bytes found in production source: '+', '.join(bad))
          print('SOURCE_INTEGRITY_OK')
          PY
      - name: Compile production runtime
        run: |
          uv run python -m compileall -q main.py app.py models.py fbm_models.py governed_routes.py governed_group_routes.py governed_group_propagation_routes.py governed_runtime_visibility_routes.py governed_fbm_routes.py governed_fbm_manual_routes.py governed_packlink_callback_routes.py services scripts
          # Keep the manual-shipping release gate visibly bound to its runtime authorities.
          test -f services/fbm_marketplace_destination.py
          test -f services/fbm_amazon_order_profile.py
          test -f services/fbm_amazon_shipping_adapter.py
      - name: Run deployment contracts
        run: |
          uv run python -m pytest -q tests/test_runtime_deployment_contract.py tests/test_fba_targeted_update_contract.py tests/test_webhook_scoped_reconcile_contract.py tests/test_webhook_push_alignment_contract.py tests/test_ui_production_alignment_contract.py tests/test_github_fly_only_deployment_contract.py tests/test_fbm_manual_shipping_order_contract.py tests/test_google_identity_alignment_contract.py tests/test_package_catalog_alignment_contract.py tests/test_revolut_billing_client_contract.py tests/test_revolut_subscription_alignment_contract.py tests/test_billing_invoice_alignment_contract.py tests/test_support_case_alignment_contract.py tests/test_governed_deployment_evidence_contract.py

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact audited GitHub commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Capture governed deployment before-state and source manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          git ls-files > deployment-evidence/tracked-production-files.txt
          git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" > deployment-evidence/changed-files.txt
          BT38_CHANGED_FILES='__bt38_full_tracked_runtime_manifest__' BT38_TRACKED_FILES_FILE=deployment-evidence/tracked-production-files.txt BT38_SOURCE_HASH_FILE=deployment-evidence/source-production-hashes.txt python scripts/verify_governed_production_source.py
          MACHINE_JSON="$(flyctl machines list --app bt38-prod --json)"
          printf '%s\n' "$MACHINE_JSON" > deployment-evidence/fly-machines-before.json
          printf '%s' "$(printf '%s' "$MACHINE_JSON" | jq -r '.[0].id // empty')" > deployment-evidence/machine-before.txt
          printf '%s' "$(printf '%s' "$MACHINE_JSON" | jq -r '.[0].config.image // empty')" > deployment-evidence/image-before.txt
          printf '%s' "$(git rev-parse HEAD^)" > deployment-evidence/previous-commit.txt
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify production DB contract before deploy when machine is available
        shell: bash
        run: |
          set -euo pipefail
          CHECK_B64="$(base64 -w0 scripts/verify_production_db_contract.py)"
          if OUT="$(flyctl ssh console --app bt38-prod --command "sh -lc 'printf %s \"$CHECK_B64\" | base64 -d > /tmp/bt38-db-contract.py && cd /app && .venv/bin/python /tmp/bt38-db-contract.py'" 2>&1)"; then printf '%s\n' "$OUT"; elif printf '%s\n' "$OUT" | grep -q 'has no started VMs'; then echo 'DB_CHECK_DEFERRED'; else printf '%s\n' "$OUT"; exit 1; fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy exact GitHub commit with Fly remote builder
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "fix/full-system-release-alignment"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
          flyctl deploy --app bt38-prod --config fly.toml --remote-only --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Start existing production machine after deploy
        shell: bash
        run: |
          set -euo pipefail
          MACHINE_ID='7849913cd19d28'
          flyctl machines list --app bt38-prod --json | jq -r '.[].id' | grep -Fxq "$MACHINE_ID"
          flyctl machine start "$MACHINE_ID" --app bt38-prod || true
          for ATTEMPT in 1 2 3 4 5 6; do flyctl ssh console --app bt38-prod --command "sh -lc 'printf MACHINE_BOOT_OK'" && exit 0; sleep $((ATTEMPT*5)); done
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify deployed image DB contract against production Neon
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app bt38-prod --command "sh -lc 'cd /app && .venv/bin/python scripts/verify_production_db_contract.py'"
          printf 'PASS' > deployment-evidence/db-contract.txt
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify all tracked deployed runtime source fingerprints
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_COUNT="$(wc -l < deployment-evidence/source-production-hashes.txt)"
          test "$EXPECTED_SOURCE_COUNT" -gt 0
          FILES_B64="$(awk '{sub(/^[^ ]+[ ][ ]/,""); print}' deployment-evidence/source-production-hashes.txt | base64 -w0)"
          flyctl ssh console --app bt38-prod --command "sh -lc 'printf %s \"$FILES_B64\" | base64 -d > /tmp/bt38-runtime-files.txt && cd /app && while IFS= read -r f; do sha256sum \"$f\"; done < /tmp/bt38-runtime-files.txt'" | tr -d '\r' | grep -E '^[0-9a-f]{64}  ' > deployment-evidence/production-source-hashes.txt
          PRODUCTION_SOURCE_COUNT="$(wc -l < deployment-evidence/production-source-hashes.txt)"
          test "$PRODUCTION_SOURCE_COUNT" = "$EXPECTED_SOURCE_COUNT"
          diff -u deployment-evidence/source-production-hashes.txt deployment-evidence/production-source-hashes.txt
          echo "ALL_DEPLOYED_SOURCE_OK commit=${{ inputs.expected_commit }} files=$PRODUCTION_SOURCE_COUNT"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Capture deployed runtime module and route registration
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_B64="$(base64 -w0 scripts/verify_governed_runtime_registration.py)"
          flyctl ssh console --app bt38-prod --command "sh -lc 'printf %s \"$SCRIPT_B64\" | base64 -d > /tmp/bt38-runtime-registration.py && cd /app && BT38_LOADED_MODULES_FILE=/tmp/loaded-bt38-modules.txt BT38_REGISTERED_ROUTES_FILE=/tmp/registered-routes.txt .venv/bin/python /tmp/bt38-runtime-registration.py'"
          flyctl ssh console --app bt38-prod --command "sh -lc 'cat /tmp/loaded-bt38-modules.txt'" | tr -d '\r' > deployment-evidence/loaded-bt38-modules.txt
          flyctl ssh console --app bt38-prod --command "sh -lc 'cat /tmp/registered-routes.txt'" | tr -d '\r' > deployment-evidence/registered-routes.txt
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify public login and dashboard redirect
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 18); do
            LOGIN_CODE="$(curl -L -sS -o /tmp/login.html -w '%{http_code}' --max-time 15 https://bt38-prod.fly.dev/login || true)"
            DASH_HEADERS="$(curl -sS -I --max-time 15 https://bt38-prod.fly.dev/dashboard || true)"
            if [ "$LOGIN_CODE" = '200' ] && printf '%s\n' "$DASH_HEADERS" | grep -Eiq '^location: .*/login'; then printf 'PASS' > deployment-evidence/public-smoke.txt; exit 0; fi
            sleep 10
          done
          printf 'FAIL' > deployment-evidence/public-smoke.txt; exit 1
      - name: Capture governed deployment after-state and write evidence record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          MACHINE_JSON="$(flyctl machines list --app bt38-prod --json || printf '[]')"
          printf '%s\n' "$MACHINE_JSON" > deployment-evidence/fly-machines-after.json
          BT38_EVIDENCE_OUT=deployment-evidence/deployment-evidence.json \
          BT38_DEPLOY_COMMIT="${{ github.sha }}" \
          BT38_PREVIOUS_DEPLOY_COMMIT="$(cat deployment-evidence/previous-commit.txt 2>/dev/null || true)" \
          BT38_FLY_APP=bt38-prod \
          BT38_MACHINE_BEFORE="$(cat deployment-evidence/machine-before.txt 2>/dev/null || true)" \
          BT38_MACHINE_AFTER="$(printf '%s' "$MACHINE_JSON" | jq -r '.[0].id // empty')" \
          BT38_IMAGE_BEFORE="$(cat deployment-evidence/image-before.txt 2>/dev/null || true)" \
          BT38_IMAGE_AFTER="$(printf '%s' "$MACHINE_JSON" | jq -r '.[0].config.image // empty')" \
          BT38_DB_CONTRACT_RESULT="$(cat deployment-evidence/db-contract.txt 2>/dev/null || printf NOT_COMPLETED)" \
          BT38_PUBLIC_SMOKE_RESULT="$(cat deployment-evidence/public-smoke.txt 2>/dev/null || printf NOT_COMPLETED)" \
          BT38_EXPECTED_SOURCE_HASH_FILE=deployment-evidence/source-production-hashes.txt \
          BT38_PRODUCTION_SOURCE_HASH_FILE=deployment-evidence/production-source-hashes.txt \
          BT38_CHANGED_FILES_FILE=deployment-evidence/changed-files.txt \
          BT38_LOADED_MODULES_FILE=deployment-evidence/loaded-bt38-modules.txt \
          BT38_REGISTERED_ROUTES_FILE=deployment-evidence/registered-routes.txt \
          python scripts/record_governed_deployment_evidence.py
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Upload governed deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bt38-prod-deployment-evidence-${{ github.sha }}
          path: deployment-evidence/
          if-no-files-found: error
      - name: Confirm governed deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "fix/full-system-release-alignment"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('deployment-evidence/deployment-evidence.json').read_text())
          assert data['verified'] is True, data
          print('GOVERNED_DEPLOYMENT_EVIDENCE_OK')
          PY
