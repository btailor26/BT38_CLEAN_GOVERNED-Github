name: Governed Fly Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Type DEPLOY_GITHUB_COMMIT_TO_BT38_PROD'
        required: true
      expected_commit:
        description: 'Exact current PR #528 head SHA'
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bt38-prod-governed-deploy
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  source-deploy-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact current PR 528 GitHub source approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_production_deploy }}" = "DEPLOY_GITHUB_COMMIT_TO_BT38_PROD"
          test "${{ github.ref_name }}" = "fix/full-system-release-alignment"
          test "${{ inputs.expected_commit }}" = "${{ github.sha }}"
          PR_JSON="$(gh api repos/${{ github.repository }}/pulls/528)"
          PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          PR_MERGED="$(printf '%s' "$PR_JSON" | jq -r '.merged')"
          PR_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.head.sha')"
          PR_BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.head.ref')"
          test "$PR_STATE" = "open"
          test "$PR_MERGED" = "false"
          test "$PR_BRANCH" = "fix/full-system-release-alignment"
          test "$PR_HEAD" = "${{ inputs.expected_commit }}"
          echo "GOVERNED_SOURCE_APPROVED commit=$PR_HEAD"

  audit:
    needs: source-deploy-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact governed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --no-dev
      - name: Verify governed production inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f fly.toml
          test -f pyproject.toml
          test -f uv.lock
          grep -q 'uv sync --frozen --no-dev' Dockerfile
          grep -q 'main:app' Dockerfile
          grep -q 'app = "bt38-prod"' fly.toml
          grep -q 'dockerfile = "Dockerfile"' fly.toml
          ! grep -q '^[[:space:]]*image[[:space:]]*=' fly.toml
      - name: Reject corrupt production source files
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.py', '.html', '.js', '.toml', '.md'}:
                  continue
              if b'\0' in path.read_bytes():
                  bad.append(str(path))
          if bad:
              raise SystemExit('Null bytes found in production source: ' + ', '.join(bad))
          print('SOURCE_INTEGRITY_OK')
          PY
      - name: Compile production runtime
        run: |
          uv run python -m py_compile \
            main.py app.py models.py fbm_models.py \
            governed_routes.py governed_group_routes.py governed_group_propagation_routes.py \
            governed_mcf_routes.py governed_runtime_visibility_routes.py governed_fbm_routes.py governed_fbm_manual_routes.py \
            governed_packlink_callback_routes.py services/fbm_provider_contract.py \
            services/fbm_order_mapper.py services/fbm_marketplace_destination.py \
            services/fbm_amazon_order_profile.py services/fbm_amazon_shipping_adapter.py services/fbm_amazon_vtr.py \
            services/fbm_packlink_adapter.py services/fbm_packlink_callback.py services/fbm_packlink_event_processor.py \
            services/fbm_post_purchase.py services/fbm_marketplace_confirmation.py services/fbm_shipping_state.py \
            services/fbm_db_delivery_promise_alignment.py services/governed_order_clarity_alignment.py \
            services/governed_fbm_page_alignment.py services/governed_fbm_dispatch_queue_alignment.py \
            services/governed_fbm_lifecycle_alignment.py services/governed_fbm_db_authority_alignment.py \
            services/governed_fbm_marketplace_dispatch_authority_alignment.py services/governed_notification_read_alignment.py \
            services/governed_action_count_ui_alignment.py services/governed_amazon_tracking_readback.py \
            services/governed_exact_ebay_order_hydration.py services/governed_ebay_oauth_scopes.py \
            services/governed_ebay_notification_registration.py services/governed_ebay_shipping_notification_alignment.py \
            services/governed_ebay_post_deploy_alignment.py services/governed_runtime_engine.py \
            services/governed_webhook_execution.py services/governed_webhook_alignment.py services/governed_push_execution.py \
            services/governed_ebay_inventory_import.py services/governed_amazon_inventory_import.py \
            services/governed_amazon_listing_fulfillment_refresh.py services/governed_listing_structure_reconcile.py \
            services/governed_marketplace_order_import.py services/governed_order_stock_mutation.py \
            services/governed_mcf_execution.py services/governed_warehouse_sync.py \
            services/governed_warehouse_inbound_alignment.py services/governed_warehouse_inbound_installer.py \
            services/google_identity.py services/public_early_access.py services/account_profile_alignment.py \
            services/cofi_settings_alignment.py services/package_catalog_alignment.py services/revolut_billing.py \
            services/revolut_subscription_alignment.py services/billing_invoice_alignment.py \
            services/support_case_alignment.py services/support_attachment_alignment.py \
            services/support_monitoring_alignment.py services/support_notification_alignment.py \
            scripts/verify_production_db_contract.py
      - name: Run deployment contracts
        run: |
          uv run python -m pytest -q \
            tests/test_runtime_deployment_contract.py tests/test_fba_targeted_update_contract.py \
            tests/test_webhook_scoped_reconcile_contract.py tests/test_webhook_push_alignment_contract.py \
            tests/test_ui_production_alignment_contract.py tests/test_amazon_eventbridge_listing_subscription_contract.py \
            tests/test_listing_structure_sync_contract.py tests/test_github_fly_only_deployment_contract.py \
            tests/test_amazon_public_appstore_alignment_contract.py tests/test_fbm_page_bounded_alignment_contract.py \
            tests/test_fbm_packlink_contract.py tests/test_fbm_packlink_import_alignment_contract.py \
            tests/test_fbm_amazon_tracking_contract.py tests/test_fbm_amazon_confirmation_payload.py \
            tests/test_fbm_manual_shipping_order_contract.py tests/test_fbm_ebay_shipping_tracking_alignment_contract.py \
            tests/test_fbm_db_delivery_performance_authority_contract.py tests/test_fbm_marketplace_dispatch_runtime_order_contract.py \
            tests/test_ebay_return_notification_registration_contract.py tests/test_order_clarity_alignment_contract.py \
            tests/test_marketplace_tracking_readback_contract.py tests/test_marketplace_dispatch_truth_recovery_contract.py \
            tests/test_fbm_marketplace_lifecycle_authority_contract.py tests/test_fbm_handoff_bell_alignment_contract.py \
            tests/test_marketplace_return_refund_alignment_contract.py tests/test_governed_warehouse_inbound_contract.py \
            tests/test_production_db_contract_gate.py tests/test_event_runtime_zero_recovery_contract.py \
            tests/test_deploy_no_recovery_contract.py tests/test_google_identity_alignment_contract.py \
            tests/test_package_catalog_alignment_contract.py tests/test_revolut_billing_client_contract.py \
            tests/test_revolut_subscription_alignment_contract.py tests/test_billing_invoice_alignment_contract.py \
            tests/test_support_case_alignment_contract.py tests/test_support_attachment_alignment_contract.py \
            tests/test_support_monitoring_alignment_contract.py tests/test_support_notification_alignment_contract.py \
            tests/test_production_startup_registration_contract.py

  deploy:
    needs: audit
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact audited GitHub commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify candidate image DB contract against production Neon
        shell: bash
        run: |
          set -euo pipefail
          CHECK_B64="$(base64 -w0 scripts/verify_production_db_contract.py)"
          DB_CHECK_OUTPUT=""
          if DB_CHECK_OUTPUT="$(flyctl ssh console --app bt38-prod --command "sh -lc 'printf %s \"$CHECK_B64\" | base64 -d > /tmp/bt38-db-contract.py && cd /app && .venv/bin/python /tmp/bt38-db-contract.py'" 2>&1)"; then
            printf '%s\n' "$DB_CHECK_OUTPUT"
          else
            printf '%s\n' "$DB_CHECK_OUTPUT"
            echo "BLOCKED: current production DB contract could not be verified before source deployment."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy exact GitHub commit with Fly remote builder
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "fix/full-system-release-alignment"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
          flyctl deploy --app bt38-prod --config fly.toml --remote-only --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify critical deployed source in one Fly SSH session
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            Dockerfile
            fly.toml
            main.py
            app.py
            governed_routes.py
            governed_fbm_routes.py
            governed_fbm_manual_routes.py
            templates/fbm.html
            templates/public_landing.html
            templates/forgot_password.html
            templates/reset_password.html
            static/js/fbm_tracking_journey.js
            static/js/fbm_delivery_promise_journey_alignment.js
            services/__init__.py
            services/account_profile_alignment.py
            services/cofi_settings_alignment.py
            services/package_catalog_alignment.py
            services/billing_invoice_alignment.py
            services/revolut_subscription_alignment.py
            services/support_case_alignment.py
            services/support_attachment_alignment.py
            services/support_monitoring_alignment.py
            services/support_notification_alignment.py
            services/fbm_db_delivery_promise_alignment.py
            services/governed_order_clarity_alignment.py
            services/governed_fbm_page_alignment.py
            services/governed_fbm_lifecycle_alignment.py
            services/fbm_marketplace_confirmation.py
            services/fbm_post_purchase.py
            services/governed_runtime_engine.py
            services/governed_webhook_execution.py
            services/google_identity.py
            services/public_early_access.py
            scripts/verify_production_db_contract.py
          )

          MANIFEST="$(mktemp)"
          for FILE in "${FILES[@]}"; do
            test -f "$FILE" || { echo "BLOCKED: audited GitHub source is missing '$FILE'."; exit 1; }
            HASH="$(sha256sum "$FILE" | awk '{print $1}')"
            printf '%s  /app/%s\n' "$HASH" "$FILE" >> "$MANIFEST"
          done
          MANIFEST_B64="$(base64 -w0 "$MANIFEST")"

          VERIFIED=0
          for ATTEMPT in 1 2 3 4 5; do
            set +e
            OUTPUT="$(flyctl ssh console --app bt38-prod --command "sh -lc 'set -eu; printf %s \"$MANIFEST_B64\" | base64 -d > /tmp/bt38-source.sha256; if sha256sum -c /tmp/bt38-source.sha256; then echo CRITICAL_REMOTE_SOURCE_OK; else echo CRITICAL_REMOTE_SOURCE_MISMATCH; exit 42; fi'" 2>&1)"
            STATUS=$?
            set -e
            printf '%s\n' "$OUTPUT"

            if [ "$STATUS" -eq 0 ] && printf '%s\n' "$OUTPUT" | grep -q 'CRITICAL_REMOTE_SOURCE_OK'; then
              VERIFIED=1
              break
            fi

            if printf '%s\n' "$OUTPUT" | grep -q 'CRITICAL_REMOTE_SOURCE_MISMATCH'; then
              echo "BLOCKED: deployed source is missing or differs from the audited GitHub source."
              exit 1
            fi

            echo "WAIT: deployed-source verification unavailable through Fly SSH (attempt $ATTEMPT/5)."
            sleep $((ATTEMPT * 3))
          done

          if [ "$VERIFIED" -ne 1 ]; then
            echo "BLOCKED: deployed-source verification remained unavailable after 5 whole-session attempts; no source mismatch is asserted."
            exit 1
          fi
          echo "CRITICAL_DEPLOYED_SOURCE_OK commit=${{ inputs.expected_commit }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify effective Google auth and browser session policy
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app bt38-prod --command "sh -lc 'cd /app && .venv/bin/python -c \"import os; from app import app; import services.public_early_access; cid=str(os.getenv(\\\"GOOGLE_CLIENT_ID\\\") or \\\"\\\").strip(); lifetime=app.config.get(\\\"PERMANENT_SESSION_LIFETIME\\\"); lifetime_seconds=int(lifetime.total_seconds()) if hasattr(lifetime,\\\"total_seconds\\\") else int(lifetime); assert app.config.get(\\\"SESSION_COOKIE_SECURE\\\") is True; assert app.config.get(\\\"SESSION_COOKIE_HTTPONLY\\\") is True; assert app.config.get(\\\"SESSION_COOKIE_SAMESITE\\\") == \\\"Lax\\\"; assert app.config.get(\\\"SESSION_REFRESH_EACH_REQUEST\\\") is True; assert app.config.get(\\\"SESSION_PERMANENT\\\") is True; assert lifetime_seconds == 1800; assert app.config.get(\\\"SESSION_COOKIE_DOMAIN\\\") is None; assert app.config.get(\\\"REMEMBER_COOKIE_SECURE\\\") is True; assert app.config.get(\\\"REMEMBER_COOKIE_HTTPONLY\\\") is True; assert app.config.get(\\\"REMEMBER_COOKIE_SAMESITE\\\") == \\\"Lax\\\"; assert cid.endswith(\\\".apps.googleusercontent.com\\\"); print(\\\"AUTH_SESSION_POLICY_OK samesite=Lax secure=True httponly=True sliding_seconds=1800 host_only=True google_client_configured=True\\\")\"'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify deployed image DB contract against production Neon
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app bt38-prod --command "sh -lc 'cd /app && .venv/bin/python scripts/verify_production_db_contract.py'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Restore Packlink callback secret setting
        shell: bash
        run: |
          set -euo pipefail
          CALLBACK_SECRET="$(flyctl ssh console --app bt38-prod --command "sh -lc 'cd /app && .venv/bin/python -c \"import hashlib,os; key=str(os.environ.get(\\\"PACKLINK_API_KEY\\\") or \\\"\\\").strip(); assert key, \\\"PACKLINK_API_KEY missing\\\"; print(hashlib.sha256((\\\"bt38-packlink-callback:\\\"+key).encode()).hexdigest())\"'" | tail -n 1)"
          test -n "$CALLBACK_SECRET"
          flyctl secrets set --app bt38-prod PACKLINK_CALLBACK_SECRET="$CALLBACK_SECRET"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Restore Packlink callback registration
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app bt38-prod --command "sh -lc \"cd /app && .venv/bin/python -c 'from app import app; from services.fbm_packlink_adapter import PacklinkAdapter; from governed_packlink_callback_routes import _register_callback; ctx=app.test_request_context(base_url=\\\"https://bt38-prod.fly.dev\\\"); ctx.push(); callback_url=_register_callback(PacklinkAdapter()); print(\\\"PACKLINK_CALLBACK_REGISTERED=ok\\\")'\""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}