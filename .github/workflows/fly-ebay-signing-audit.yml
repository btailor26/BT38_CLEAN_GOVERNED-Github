name: Fly eBay Signing Audit

on:
  push:
    branches:
      - fix/full-system-release-alignment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-runtime-signing-material:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check Fly secret metadata names only
        shell: bash
        run: |
          set -euo pipefail
          SECRET_NAMES="$(flyctl secrets list --app bt38-prod | awk 'NR > 1 {print $1}')"
          FAILED=0
          for KEY in EBAY_SIGNATURE_PRIVATE_KEY EBAY_SIGNATURE_PUBLIC_KEY_JWE; do
            if printf '%s\n' "$SECRET_NAMES" | grep -Fxq "$KEY"; then
              echo "FLY_SECRET_METADATA $KEY=PRESENT"
            else
              echo "FLY_SECRET_METADATA $KEY=MISSING"
              FAILED=1
            fi
          done
          test "$FAILED" -eq 0
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Detect running bt38-prod machine
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          STARTED="$(flyctl machine list --app bt38-prod --json | python -c 'import json,sys; data=json.load(sys.stdin); print(sum(1 for m in data if str(m.get("state") or "").lower() in {"started","running"}))')"
          if [ "$STARTED" -gt 0 ]; then
            echo "started=true" >> "$GITHUB_OUTPUT"
            echo "BT38_PROD_STARTED_MACHINE_PRESENT count=$STARTED"
          else
            echo "started=false" >> "$GITHUB_OUTPUT"
            echo "BT38_PROD_RUNTIME_SIGNING_AUDIT_DEFERRED reason=no_started_machine"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Check running bt38-prod environment without exposing values
        if: steps.runtime.outputs.started == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(flyctl ssh console --app bt38-prod --command "sh -lc 'cd /app && .venv/bin/python -c \"import os; keys=(\\\"EBAY_SIGNATURE_PRIVATE_KEY\\\",\\\"EBAY_SIGNATURE_PUBLIC_KEY_JWE\\\"); missing=[k for k in keys if not os.getenv(k)]; [print(k + (\\\"=PRESENT length=\\\" + str(len(os.getenv(k) or \\\"\\\")) if os.getenv(k) else \\\"=MISSING\\\")) for k in keys]; raise SystemExit(1 if missing else 0)\"'" 2>&1)" || {
            printf '%s\n' "$OUTPUT"
            echo "BLOCKED: a started bt38-prod Machine exists but runtime eBay signing material could not be proven."
            exit 1
          }
          printf '%s\n' "$OUTPUT"
          echo "EBAY_RUNTIME_SIGNING_MATERIAL_OK"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Preserve signing gate while production runtime is stopped
        if: steps.runtime.outputs.started != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "No started bt38-prod Machine exists, so runtime value presence cannot be SSH-audited before recovery."
          echo "Required Fly signing secret metadata was proven above. Runtime signing-value presence remains mandatory after production starts."
          echo "EBAY_RUNTIME_SIGNING_AUDIT_DEFERRED_NO_STARTED_MACHINE"
