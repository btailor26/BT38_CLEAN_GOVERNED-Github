name: Deployment Readiness

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/full-system-release-alignment

jobs:
  deployment-readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bt38_test
          POSTGRES_PASSWORD: bt38_test
          POSTGRES_DB: bt38_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bt38_test -d bt38_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_ENV: dev
      DEV_DATABASE_URL: postgresql://bt38_test:bt38_test@127.0.0.1:5432/bt38_test
      DATABASE_URL: postgresql://bt38_test:bt38_test@127.0.0.1:5432/bt38_test
      SESSION_SECRET: bt38-ci-isolated-session-secret
      BT38_ALLOW_DATABASE_TESTS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact-head full-source candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "RUN find /app -mindepth 1 -maxdepth 1 ! -name '.venv' -exec rm -rf {} +" Dockerfile.current-image-alignment
          grep -Fq 'COPY . /app' Dockerfile.current-image-alignment
          for PATH_PREFIX in services templates static migrations scripts; do
            if grep -Eq "^${PATH_PREFIX}/$" .dockerignore; then
              echo "BLOCKED: runtime category excluded from exact-head candidate: ${PATH_PREFIX}/"
              exit 1
            fi
          done
          git fetch --no-tags origin main
          RUNTIME_COUNT=0
          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue
            case "$FILE" in
              .github/*|tests/*|docs/*|*.md|.gitignore)
                continue
                ;;
            esac
            if [ ! -e "$FILE" ]; then
              echo "BLOCKED: changed runtime/config path is absent from exact head: $FILE"
              exit 1
            fi
            RUNTIME_COUNT=$((RUNTIME_COUNT + 1))
          done < <(git diff --name-only origin/main...HEAD)
          test "$RUNTIME_COUNT" -gt 0
          echo "EXACT_HEAD_FULL_SOURCE_CANDIDATE_BOUNDARY_OK runtime_changed_files=$RUNTIME_COUNT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --frozen --no-dev

      - name: Compile complete tracked Python source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' PY_FILES < <(git ls-files -z '*.py')
          test "${#PY_FILES[@]}" -gt 0
          uv run python -m py_compile "${PY_FILES[@]}"
          echo "FULL_TRACKED_PYTHON_COMPILE_OK files=${#PY_FILES[@]}"

      - name: Verify exact candidate image alignment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f Dockerfile.current-image-alignment
          test -f fly.toml
          test -f pyproject.toml
          test -f uv.lock
          grep -q 'uv sync --frozen --no-dev' Dockerfile
          grep -q 'main:app' Dockerfile
          grep -q 'app = "bt38-prod"' fly.toml
          grep -q 'dockerfile = "Dockerfile.current-image-alignment"' fly.toml
          grep -Fq 'FROM registry.fly.io/bt38-prod:deployment-01M2BK6REHCGKJQ34796T3WK8P@sha256:3f7ca913f010fea40a0b8fe20354cae7c010f802328fa0e1eb41258f32168a8b' Dockerfile.current-image-alignment
          grep -Fq 'COPY . /app' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/cofi_settings_alignment.py /app/services/cofi_settings_alignment.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/revolut_billing.py /app/services/revolut_billing.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/revolut_subscription_alignment.py /app/services/revolut_subscription_alignment.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/support_case_alignment.py /app/services/support_case_alignment.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/support_attachment_alignment.py /app/services/support_attachment_alignment.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/support_monitoring_alignment.py /app/services/support_monitoring_alignment.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY services/support_notification_alignment.py /app/services/support_notification_alignment.py' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260911-customer-account-profile.sql /app/migrations/manual/20260911-customer-account-profile.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260911-package-catalog.sql /app/migrations/manual/20260911-package-catalog.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260911-revolut-subscription-binding.sql /app/migrations/manual/20260911-revolut-subscription-binding.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260911-billing-invoices.sql /app/migrations/manual/20260911-billing-invoices.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260911-support-cases.sql /app/migrations/manual/20260911-support-cases.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260912-package-pricing-discount.sql /app/migrations/manual/20260912-package-pricing-discount.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY migrations/manual/20260913-support-case-attachments.sql /app/migrations/manual/20260913-support-case-attachments.sql' Dockerfile.current-image-alignment
          grep -Fq 'COPY scripts/verify_production_db_contract.py /app/scripts/verify_production_db_contract.py' Dockerfile.current-image-alignment
          ! grep -Eq 'apt-get |pip install|uv sync|npm (install|ci)' Dockerfile.current-image-alignment
          ! grep -q '^[[:space:]]*image[[:space:]]*=' fly.toml
          echo "EXACT_CANDIDATE_IMAGE_ALIGNMENT_READY"

      - name: Run complete Python contract suite
        id: python-contracts
        continue-on-error: true
        shell: bash
        run: |
          set +e
          uv run python -m pytest -q tests test_concurrent_sales.py 2>&1 | tee pytest-contract-suite.txt
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > pytest-contract-suite.exit
          exit "$STATUS"

      - name: Upload exact-head Python contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-python-contract-evidence
          path: |
            pytest-contract-suite.txt
            pytest-contract-suite.exit
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Python contract gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(cat pytest-contract-suite.exit)"
          if [ "$STATUS" -ne 0 ]; then
            echo "BLOCKED: complete Python contract suite failed with exit=$STATUS"
            exit "$STATUS"
          fi
          echo "COMPLETE_PYTHON_CONTRACT_SUITE_OK"
